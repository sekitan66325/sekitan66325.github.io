<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 64" width="212" height="64" fill="none">
  <!-- 左側：シンボルマーク -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="var(--exdia-bg, #2F6F73)" />
  <line x1="12" y1="18" x2="52" y2="18" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.25" />
  <line x1="12" y1="32" x2="52" y2="32" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.25" />
  <line x1="12" y1="46" x2="52" y2="46" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.25" />
  <line x1="17" y1="46" x2="47" y2="18" stroke="var(--exdia-accent, #7DD3FC)" stroke-width="4.2" stroke-linecap="round" />
  <line x1="17" y1="18" x2="47" y2="46" stroke="#FFFFFF" stroke-width="4.4" stroke-linecap="round" />
  <circle cx="17" cy="18" r="3.4" fill="var(--exdia-bg, #2F6F73)" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="32" cy="32" r="4.0" fill="var(--exdia-bg, #2F6F73)" stroke="#FFFFFF" stroke-width="2.6" />
  <circle cx="47" cy="46" r="3.4" fill="var(--exdia-bg, #2F6F73)" stroke="#FFFFFF" stroke-width="2.5" />

  <!-- 右側：幾何学ロゴタイプ "ExDia" -->
  <g stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- E -->
    <path d="M97 18H78V46H97M78 32H94" stroke="var(--exdia-bg, #2F6F73)" />
    <!-- x（交差スジをモチーフにした小文字x） -->
    <line x1="105" y1="46" x2="123" y2="25" stroke="var(--exdia-x-sub, #0284C7)" />
    <line x1="105" y1="25" x2="123" y2="46" stroke="var(--exdia-bg, #2F6F73)" />

    <!-- D -->
    <path d="M133 18H142A13 14 0 0 1 142 46H133Z" stroke="var(--exdia-text, #1E293B)" />
    <!-- i -->
    <circle cx="165" cy="18.2" r="2.7" fill="var(--exdia-bg, #2F6F73)" stroke="none" />
    <line x1="165" y1="25.5" x2="165" y2="46" stroke="var(--exdia-text, #1E293B)" />
    <!-- a -->
    <circle cx="184.5" cy="35.5" r="9.5" stroke="var(--exdia-text, #1E293B)" />
    <line x1="194" y1="25.5" x2="194" y2="46" stroke="var(--exdia-text, #1E293B)" />
  </g>
</svg>