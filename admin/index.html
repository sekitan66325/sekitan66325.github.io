<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>真岡線運用掲示板 - 管理者ダッシュボード</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="admin.css">
  <script defer src="datepicker.js?v=3"></script>
  <link rel="stylesheet" href="datepicker.css">
</head>

<body>

  <header class="site-header">
    <div class="header-inner container" style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; width: 92%;">
      <h1 class="logo">管理者パネル</h1>
      <button id="logout-btn" class="btn-admin btn-danger" style="display: none;" onclick="handleLogout()">ログアウト</button>
    </div>
  </header>

  <main class="container" id="main-container" style="max-width: 1200px;">
    
    <section id="login-view" style="max-width: 380px; margin: 40px auto;">
      <div class="notice-section" style="text-align: center;">
        <strong style="font-size: 1.1rem; margin-bottom: 12px;">管理者ログイン</strong>

        <form id="admin-login-form" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label">管理者ID</label>
            <!-- classはそのままで OK / autocomplete="username" を指定 -->
            <input type="text" id="login-id" name="admin_username" class="form-input" autocomplete="username" required>
          </div>
          
          <div class="form-group">
            <label class="form-label">パスワード</label>
            <!-- classはそのままで OK / autocomplete="current-password" を指定 -->
            <input type="password" id="login-pass" name="admin_password" class="form-input" autocomplete="current-password" required>
          </div>
          
          <button type="submit" id="login-submit-btn" class="form-submit-btn">ログイン</button>
        </form>

      </div>
    </section>

    <section id="dashboard-view" style="display: none;">
      
        <button id="tab-btn-posts" class="btn-admin active" onclick="switchAdminTab('posts')" >投稿管理</button>
        <button id="tab-btn-logs" class="btn-admin" onclick="switchAdminTab('logs')">操作・編集ログ</button>
        <button id="tab-btn-trains" class="btn-admin" onclick="switchAdminTab('trains')">運行データ管理</button>
        <button id="tab-btn-operations" class="btn-admin" onclick="switchAdminTab('operations')">運用ベース管理</button>
      </div>

      <div id="panel-posts" class="view-panel show">
        <div class="board-header-row">
          <h2 class="section-title">投稿一覧（全件）</h2>
          <div class="search-box">
            <input type="search" id="admin-search" class="search-input" placeholder="投稿検索..." oninput="renderAdminPosts()">
          </div>
        </div>

        <ul id="admin-post-list" style="list-style: none;">
          <li style="text-align: center; color: var(--text-secondary); padding: 20px;">読み込み中...</li>
        </ul>
      </div>

      <div id="panel-logs" class="view-panel">
        <h2 class="section-title">操作・変更履歴 (edit_log)</h2>
        <div id="admin-log-list">
          <div style="text-align: center; color: var(--text-secondary); padding: 20px;">読み込み中...</div>
        </div>
      </div>

      <div id="panel-trains" class="view-panel">
        <div class="board-header-row">
          <h2 class="section-title">運行データ (timetable.json) 管理</h2>
          <div style="display: flex; gap: 8px;">
            <button class="btn-admin" onclick="loadTimetableFromRepo()">リポジトリから読込</button>
            <input type="file" id="timetable-upload" accept=".json" style="display:none;" onchange="handleTimetableUpload(event)">
            <button class="btn-admin" onclick="document.getElementById('timetable-upload').click()">ファイルから読込</button>
            <button class="btn-admin btn-success" onclick="exportTimetable()">GitHubへ反映 (プッシュ)</button>
          </div>
        </div>
        
        <div id="trains-workspace" style="display: flex; gap: 20px; margin-top: 16px;">
          <!-- 列車リスト -->
          <div class="train-list-sidebar">
            <input type="search" id="train-search" class="search-input" placeholder="列車検索 (例: 103)..." oninput="renderTrainList()">
            <ul id="train-list" style="list-style: none; padding: 0; margin-top: 12px; display: flex; flex-direction: column; gap: 8px;">
              <li style="color: var(--text-secondary); text-align: center;">データを読み込んでください</li>
            </ul>
          </div>
          
          <!-- エディタ -->
          <div id="train-editor-container" class="train-editor-container" style="display: none;">
            <!-- ここにJavaScriptでフォームを生成 -->
          </div>
        </div>
      </div>

      <div id="panel-operations" class="view-panel">
        <h2 class="section-title">運用ベース管理</h2>
        <p style="color: var(--text-secondary); margin-bottom: 16px;">
          曜日ごとにどの列車をどの運用に入れるか設定します。<br>
          ※設定したデータは、列車ベースのデータと同じ timetable.json に保存されます。
        </p>
        <div id="op-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px;">
          <!-- JS will render operations here -->
        </div>
      </div>

    </section>

  </main>

  <div id="password-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3 style="margin-top:0; font-size: 1.1rem; color: var(--text-primary);">初回パスワードの変更</h3>
      <p style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 12px;">
        セキュリティ保護のため、初期パスワードを変更してください。
      </p>
      <form onsubmit="handleChangePassword(event)">
        <div class="form-group">
          <label class="form-label">新しいパスワード（半角英数字4桁以上）</label>
          <input type="password" id="new-password" class="form-input" minlength="4" required>
        </div>
        <button type="submit" class="form-submit-btn">変更して開始する</button>
      </form>
    </div>
  </div>

  <div id="admin-edit-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3 style="margin-top:0; font-size: 1.1rem; color: var(--text-primary);">投稿内容の直接修正</h3>
      <input type="hidden" id="admin-edit-id">
      <div class="form-group" style="margin-top: 12px;">
        <label class="form-label">本文</label>
        <textarea id="admin-edit-message" class="form-textarea" rows="5"></textarea>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
        <button type="button" onclick="closeAdminEditModal()" class="btn-admin">キャンセル</button>
        <button type="button" onclick="submitAdminEdit()" class="form-submit-btn" style="width: auto; padding: 8px 16px; margin: 0;">保存する</button>
      </div>
    </div>
  </div>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0GM4B0FTW9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-0GM4B0FTW9');
  </script>

  <script src="../config.js"></script>
  <script src="admin.js?v=639231599055514103"></script>
</body>
</html>
