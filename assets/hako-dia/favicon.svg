<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="箱ダイヤ描画システム アイコン">
  <!-- Outer badge in app primary teal -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#2F6F73"/>
  <!-- Diagram paper inner frame -->
  <rect x="9" y="9" width="46" height="46" rx="8" fill="#ffffff"/>
  <!-- Station vertical reference lines (centered at x=32) -->
  <line x1="19" y1="14" x2="19" y2="50" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="14" x2="32" y2="50" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <line x1="45" y1="14" x2="45" y2="50" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  <!-- Turnaround step connectors (drawn under train strokes) -->
  <line x1="45" y1="20" x2="45" y2="33" stroke="#1e293b" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="19" y1="33" x2="19" y2="45" stroke="#1e293b" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Leg 1: Left to Right (Local, dark slate) -->
  <line x1="19" y1="20" x2="45" y2="20" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <!-- Leg 2: Right to Left (Express highlight, crimson accent) -->
  <line x1="45" y1="33" x2="19" y2="33" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <!-- Leg 3: Left to Right -->
  <line x1="19" y1="45" x2="45" y2="45" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <!-- Out-of-depot white circle symbol centered on station 1 -->
  <circle cx="19" cy="20" r="3.9" fill="#ffffff" stroke="#1e293b" stroke-width="2.4"/>
  <!-- Return-to-depot white triangle symbol centered on station 3 -->
  <polygon points="45,40.8 49.4,48.2 40.6,48.2" fill="#ffffff" stroke="#1e293b" stroke-width="2.3" stroke-linejoin="round"/>
</svg>
